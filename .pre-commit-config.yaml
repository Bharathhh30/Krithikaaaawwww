minimum_pre_commit_version: "4.2.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and autofix
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: mypy
        name: Mypy strict type check
        entry: uv run --no-sync mypy krithika
        language: system
        pass_filenames: false
        types: [python]
