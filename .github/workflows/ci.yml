name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      full_validation:
        description: Run the full test and audit gates when called by a release workflow.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-checks:
    name: fast-checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy type check
        shell: pwsh
        run: |
          if (Test-Path "krithika") {
            uv run --no-sync mypy krithika
          } else {
            Write-Host "Skipping mypy: the planned krithika package has not been created yet."
          }

      - name: Bandit security scan
        shell: pwsh
        run: |
          if (Test-Path "krithika") {
            uv run --no-sync bandit -r krithika -ll
          } else {
            Write-Host "Skipping Bandit: the planned krithika package has not been created yet."
          }

      - name: Unit tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem "tests/unit" -Recurse -File -Filter "test_*.py" -ErrorAction SilentlyContinue
          if ($tests) {
            uv run --no-sync pytest tests/unit -v
          } else {
            Write-Host "Skipping unit tests: no unit test files exist yet."
          }

  merge-validation:
    name: merge-validation
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.full_validation }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Run all safe tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem "tests" -Recurse -File -Filter "test_*.py" -ErrorAction SilentlyContinue
          if ($tests) {
            uv run --no-sync pytest tests -m "not live_api and not system" -v
          } else {
            Write-Host "Skipping full test suite: no test files exist yet."
          }

      - name: Audit locked dependencies
        run: uv audit --locked
