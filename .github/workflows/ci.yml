name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      full_validation:
        description: Run the full test and audit gates when called by a release workflow.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-checks:
    name: fast-checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy type check
        run: uv run --no-sync mypy krithika

      - name: Bandit security scan
        run: uv run --no-sync bandit -r krithika -ll

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit -v

  merge-validation:
    name: merge-validation
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.full_validation }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Run all safe tests
        run: uv run --no-sync pytest tests -m "not live_api and not system" -v

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Smoke-build Windows executable
        run: uv run --no-sync pyinstaller --onefile --name krithika --windowed main.py

      - name: Include example configuration beside executable
        run: Copy-Item config.yaml.example dist/config.yaml.example

      - name: Verify release files exist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/krithika.exe")) {
            throw "PyInstaller did not produce dist/krithika.exe"
          }
          if (-not (Test-Path "dist/config.yaml.example")) {
            throw "The example configuration was not copied beside the executable"
          }
